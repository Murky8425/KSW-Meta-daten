<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Konto löschen</title></head>
<body><main><h1>Konto löschen</h1><p>Wir senden einen Bestätigungslink an {{ request.user.email }}. Nach der Bestätigung werden dein Konto und alle gespeicherten Bilder endgültig gelöscht.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<button type="submit">Löschbestätigung per E-Mail senden</button></form><p><a href="{% url 'index' %}">Abbrechen</a></p></main></body></html>
