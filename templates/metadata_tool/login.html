<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Bildarchiv</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f6f3ed; color:#17313b; font:16px system-ui,sans-serif; }
    main { width:min(100% - 2rem, 28rem); padding:2rem; background:#fffdf9; border:1px solid #d8e1df; border-radius:12px; }
    h1 { margin-top:0; } label { display:block; margin:.9rem 0 .3rem; font-weight:700; }
    input { box-sizing:border-box; width:100%; padding:.7rem; border:1px solid #d8e1df; border-radius:6px; font:inherit; }
    button { margin-top:1.2rem; padding:.7rem 1rem; border:0; border-radius:6px; background:#087f79; color:white; font-weight:700; cursor:pointer; }
    .errorlist { color:#8e3928; padding-left:1.2rem; }
    a { color:#075d5b; }
  </style>
</head>
<body><main>
  <p>Bildarchiv</p><h1>Anmelden</h1>
  {% if form.errors %}<p role="alert">Benutzername oder Passwort ist nicht korrekt.</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label for="id_username">Benutzername</label>{{ form.username }}
    <label for="id_password">Passwort</label>{{ form.password }}
    <label for="id_recovery_code">Recovery-Code</label>{{ form.recovery_code }}
    {{ form.non_field_errors }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Anmelden</button>
  </form>
  <p>Noch kein Konto? <a href="{% url 'register' %}">Registrieren</a></p>
</main></body>
</html>
