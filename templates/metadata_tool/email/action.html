<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }}</title>
</head>
<body style="margin:0;padding:0;background:#f2f5f3;color:#202b27;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f5f3;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dce5df;">
        <tr><td style="padding:24px 32px;background:#173d32;color:#ffffff;font-size:15px;font-weight:bold;">KSW Bildarchiv</td></tr>
        <tr><td style="padding:36px 32px 12px;">
          <h1 style="margin:0 0 18px;font-size:25px;line-height:1.3;color:#173d32;">{{ heading }}</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">{{ message }}</p>
          <p style="margin:0 0 24px;">
            <a href="{{ action_url }}" style="display:inline-block;padding:14px 22px;background:#176b4b;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;">{{ button_label }}</a>
          </p>
          <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:#48574f;">{{ validity }}</p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#48574f;">{{ note }}</p>
        </td></tr>
        <tr><td style="padding:18px 32px;border-top:1px solid #e5ebe7;font-size:12px;line-height:1.5;color:#66736c;">Diese Nachricht wurde automatisch vom KSW Bildarchiv versendet.</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
